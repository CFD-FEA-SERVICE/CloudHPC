name: cloudHPC tools .exe build

# Builds the Windows executables of the XML-GUI tools with PyInstaller
# inside a conda (Miniforge) environment so that pythonocc-core — which is
# only distributed on conda-forge, not PyPI — gets frozen into the apps and
# the CAD/GEO tab works in the installed tools. The apps are then packed
# into a single Inno Setup installer published on the v0.1-alpha release,
# replacing any previous installer asset.
#
# Repository layout expected:
#   GUI/src/            python sources (xmlreader.py entry point)
#   GUI/xml/            GUIsetup-<app>.xml configuration files
#   GUI/build/SPEC/     one PyInstaller .spec per app (with collect_all('OCC'))
#   GUI/build/          InnoSetup_eseguibile_unico.iss, SPEC/icon.ico
#   GUI/LOGO.png        logo installed next to each app
#   GUI/requirements.txt

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'GUI/**'

permissions:
  contents: write   # required to delete/upload release assets

env:
  RELEASE_TAG: v0.1-alpha

jobs:
  windows-installer:
    runs-on: windows-latest

    # All run steps use pwsh: setup-miniconda configures the PowerShell
    # profile so the 'buildenv' conda environment is auto-activated.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniforge (conda)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: buildenv
          python-version: '3.11'
          auto-activate-base: false

      - name: Install dependencies (conda + pip)
        run: |
          # PySide6 arriva da conda-forge INSIEME a pythonocc-core, così l'intero
          # runtime Qt proviene da un'unica fonte (Library\bin) ed è coerente.
          # Mischiare il wheel pip di PySide6 (che porta un SUO Qt dentro
          # site-packages) con l'ambiente conda produce due Qt diversi nel
          # bundle e l'errore all'avvio:
          #   "DLL load failed while importing QtWidgets: procedura non trovata"
          # pip resta solo per i pacchetti senza Qt.
          conda install -y -c conda-forge pythonocc-core pyside6
          python -m pip install --upgrade pip
          pip install pyvista pyvistaqt requests pyinstaller
          conda list | Select-String -Pattern "pyside6|shiboken|qt-main|qt6-main|pythonocc|occt"
          python -c "import PySide6, OCC.Core.STEPControl; print('PySide6', PySide6.__version__, '+ OCC OK')"

      - name: Build applications (PyInstaller)
        run: |
          # TEMPORANEO: si compila solo bcSnappy per accorciare i tempi di test.
          # Per tornare a compilare tutto basta scommentare la riga sotto
          # ed eliminare quella con la sola bcSnappy.
          # $apps = @("bcSnappy", "carParks", "turboApp", "envyFlow", "fea")
          $apps = @("bcSnappy")
          foreach ($app in $apps) {
            Write-Host "=== Building $app ==="
            python -m PyInstaller --noconfirm "GUI\build\SPEC\$app.spec"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Diagnose bundled libraries
        run: |
          # Se persiste "DLL load failed while importing QtWidgets" serve sapere
          # quali librerie sono finite nel bundle e da dove.
          $ps6 = python -c "import PySide6,os;print(os.path.dirname(PySide6.__file__))"
          Write-Host "PySide6 dir: $ps6"
          python -c "import PySide6;print('PySide6', PySide6.__version__)"
          python -c "import shiboken6;print('shiboken6', shiboken6.__version__)"

          Write-Host "`n--- Qt6*.dll nel bundle ---"
          Get-ChildItem "dist\bcSnappy" -Recurse -Filter "Qt6*.dll" |
            Select-Object Name, @{n='FileVersion';e={$_.VersionInfo.FileVersion}} |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          # Ogni libreria del bundle che esiste anche in PySide6 deve essere
          # IDENTICA a quella di PySide6: se differisce, e' la causa del crash.
          Write-Host "--- collisioni residue con PySide6 ---"
          $ps6libs = @{}
          Get-ChildItem $ps6 -Recurse -Include *.dll,*.pyd | ForEach-Object {
            $ps6libs[$_.Name.ToLower()] = $_
          }
          $mismatch = 0
          Get-ChildItem "dist\bcSnappy" -Recurse -Include *.dll,*.pyd | ForEach-Object {
            $ref = $ps6libs[$_.Name.ToLower()]
            if ($ref -and $ref.Length -ne $_.Length) {
              Write-Host ("MISMATCH {0}: bundle {1} B, PySide6 {2} B" -f $_.Name, $_.Length, $ref.Length)
              $mismatch++
            }
          }
          Write-Host "collisioni residue: $mismatch"

          Write-Host "`n--- runtime MSVC nel bundle ---"
          Get-ChildItem "dist\bcSnappy" -Recurse -Include vcruntime*.dll,msvcp*.dll |
            Select-Object Name, @{n='FileVersion';e={$_.VersionInfo.FileVersion}} |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: List bundled Qt libraries (diagnostic)
        run: |
          # Tutte le Qt6*.dll nel bundle devono avere la STESSA FileVersion
          # (fonte unica conda-forge). Versioni diverse = conflitto residuo.
          Get-ChildItem -Path "dist\bcSnappy" -Recurse -Filter "Qt6*.dll" |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}},
                          @{n='FileVersion';e={$_.VersionInfo.FileVersion}} |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Get-ChildItem -Path "dist\bcSnappy" -Recurse -Filter "shiboken6*" |
            ForEach-Object { Write-Host "shiboken6: $($_.FullName)" }

      - name: Verify OCC libraries were frozen in
        run: |
          # A working OCC bundle must contain the OpenCASCADE TKernel DLL.
          $found = Get-ChildItem -Path "dist\bcSnappy" -Recurse -Filter "TKernel*.dll"
          if (-not $found) {
            Write-Host "ERROR: OpenCASCADE DLLs missing from the frozen app" -ForegroundColor Red
            exit 1
          }
          Write-Host "OCC libraries present:" $found[0].FullName

      - name: Build installer (Inno Setup)
        run: |
          # ISCC is called directly instead of through a JS action: with the
          # OCC libraries bundled the compiler prints one line per packed file,
          # which overflowed the Node child_process stdout buffer of the action
          # ("stdout maxBuffer length exceeded"). /Q also keeps the log short.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found on the runner, installing it..."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /Q /DMyAppName=CFS_cloudHPC_tools "GUI\build\InnoSetup_eseguibile_unico.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          # The file name comes from OutputBaseFilename in the .iss (it embeds
          # MyAppVersion), so it is discovered here rather than hardcoded: a
          # version bump in the .iss must not break the workflow.
          $exe = Get-ChildItem "GUI\build\Output\*.exe" |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "Inno Setup produced no .exe in GUI\build\Output" }
          "INSTALLER_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_NAME=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer produced: $($exe.Name)"

      - name: Check installer size
        run: |
          $exe = Get-Item "$env:INSTALLER_PATH"
          $mb  = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "Installer: $($exe.FullName) — $mb MB"
          # GitHub refuses release assets larger than 2 GB.
          if ($exe.Length -ge 2GB) {
            throw "Installer is $mb MB: too large to be published as a release asset."
          }

      - name: Publish installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove any previous installer asset(s), then upload the new one.
          $assets = gh release view "$env:RELEASE_TAG" --json assets --jq '.assets[].name'
          foreach ($a in $assets) {
            if ($a -like "*installer-*.exe") {
              Write-Host "Deleting previous asset: $a"
              gh release delete-asset "$env:RELEASE_TAG" "$a" --yes
            }
          }
          gh release upload "$env:RELEASE_TAG" "$env:INSTALLER_PATH"

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFS_cloudHPC_tools-installer
          path: ${{ env.INSTALLER_PATH }}
