[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudhpc-mcp"
version = "0.1.0"
description = "MCP server for cloudHPC: upload cases, launch and monitor simulations, download results"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "CFD FEA SERVICE SRL" }]
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cloudhpc-mcp = "cloudhpc_mcp.server:main"

[project.urls]
Homepage = "https://cloudhpc.cloud"
Documentation = "https://docs.cloudhpc.cloud"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudhpc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
